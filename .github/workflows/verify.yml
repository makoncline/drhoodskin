name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/makoncline/drhoodskin:${{ github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: node --test scripts/node-runtime-check.mjs
      - run: npm test
      - run: npm run lint

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: app
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [verify, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to makon-dev-0
        env:
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST \
            --url "https://deploy.makon.dev/deploy/drhoodskin" \
            --header "Authorization: Bearer ${DEPLOY_WEBHOOK_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"image_tag\":\"${{ github.sha }}\"}"
