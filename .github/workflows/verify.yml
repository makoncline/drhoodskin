name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: node --test scripts/node-runtime-check.mjs
      - run: npm test
      - run: npm run lint
      - run: docker build --tag drhoodskin-verify .
