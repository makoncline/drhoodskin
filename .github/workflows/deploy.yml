name: Deploy production
on: {workflow_dispatch: {}}
permissions: {contents: read}
concurrency: {group: production, cancel-in-progress: false}
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:ee15712262f017b8157421b212b12099146645f44b1bc5c0514cbbe6a229b1d0
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: corepack enable && corepack prepare pnpm@10.29.2 --activate && pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/prepare-ops.js
      - name: Deploy through 1Password
        env: {OP_TOKEN: '${{ secrets.OP_TOKEN }}'}
        run: |
          set -o pipefail
          pnpm deploy:hosted | tee deployment.log
          pnpm exec varlock run --path ops --skip-cache --inject vars --filter CLOUDFLARE_API_TOKEN -- node scripts/release-record.js
      - run: node scripts/live-check.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-${{ github.sha }}
          path: |
            deployment.log
            test-results
          retention-days: 7
