name: Check, build, and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:ee15712262f017b8157421b212b12099146645f44b1bc5c0514cbbe6a229b1d0
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.3'
      - name: Install pinned dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          corepack enable
          corepack prepare pnpm@10.29.2 --activate
          pnpm install --frozen-lockfile
      - run: node --test scripts/node-runtime-check.mjs
      - run: pnpm check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-${{ github.sha }}
          path: test-results
          retention-days: 3

  image:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/makoncline/drhoodskin:${{ github.sha }}
    outputs:
      image_digest: ${{ steps.published.outputs.image_digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an existing commit image
        id: release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if docker buildx imagetools inspect "$IMAGE" > "$RUNNER_TEMP/drhoodskin-release-manifest.txt" 2> "$RUNNER_TEMP/drhoodskin-release-error.txt"; then
            docker pull "$IMAGE"
            echo 'reused=true' >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'not found|manifest unknown|no such manifest' "$RUNNER_TEMP/drhoodskin-release-error.txt"; then
            echo 'reused=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/drhoodskin-release-error.txt"
            exit 1
          fi
      - name: Build a new release image
        if: steps.release.outputs.reused != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the exact image under the runtime memory limit
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$GITHUB_SHA"
          docker run --rm --memory=256m --memory-swap=256m \
            --mount type=bind,source="$PWD/scripts",target=/app/scripts,readonly \
            --mount type=bind,source="$PWD/src/lib/nextPatientSchedule.ts",target=/app/src/lib/nextPatientSchedule.ts,readonly \
            --entrypoint node "$IMAGE" --test scripts/site-runtime-check.mjs
      - name: Publish the verified private image once
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.release.outputs.reused != 'true'
        run: |
          if docker buildx imagetools inspect "$IMAGE" > "$RUNNER_TEMP/drhoodskin-release-manifest.txt" 2> "$RUNNER_TEMP/drhoodskin-release-error.txt"; then
            echo 'Refusing to overwrite a commit image published during this build'
            exit 1
          elif ! grep -Eqi 'not found|manifest unknown|no such manifest' "$RUNNER_TEMP/drhoodskin-release-error.txt"; then
            cat "$RUNNER_TEMP/drhoodskin-release-error.txt"
            exit 1
          fi
          docker push "$IMAGE"
      - name: Confirm the image is private and record its digest
        id: published
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          anonymous=$(mktemp -d)
          if DOCKER_CONFIG="$anonymous" docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo 'The image is readable without credentials. Make the package private before deploying.'
            exit 1
          fi
          digest=$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$IMAGE")
          echo "$digest"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [check, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Skip a superseded release
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $GITHUB_SHA; main is now $current"
          fi
      - name: Deploy the verified image to makon-dev-0
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          IMAGE_DIGEST: ${{ needs.image.outputs.image_digest }}
        run: |
          test -n "$DEPLOY_WEBHOOK_TOKEN" || { echo 'DEPLOY_WEBHOOK_TOKEN is not configured'; exit 1; }
          echo "Deploying $IMAGE_DIGEST"
          curl --fail-with-body --show-error --silent --max-time 600 \
            --request POST --url 'https://deploy.makon.dev/deploy/drhoodskin' \
            --header "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"image_tag\":\"$GITHUB_SHA\"}"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: steps.current.outputs.deploy == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: '24.22.3'
      - name: Check live patient and agent boundaries
        if: steps.current.outputs.deploy == 'true'
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/live-check.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-check-${{ github.sha }}
          path: test-results/live-check.json
          if-no-files-found: ignore
          retention-days: 7
