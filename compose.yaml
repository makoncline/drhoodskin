services:
  drhoodskin:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PORT: 3000
      LOG_DIR: /app/data/logs
    volumes:
      - ./data:/app/data
    networks:
      edge:
        aliases:
          - drhoodskin

networks:
  edge:
    external: true
