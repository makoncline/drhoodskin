services:
  drhoodskin:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      LOG_DIR: /app/data/logs
    volumes:
      - ./data:/app/data
    networks:
      edge:
        aliases:
          - drhoodskin

networks:
  edge:
    external: true
